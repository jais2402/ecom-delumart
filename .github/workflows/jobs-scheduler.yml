# Calls the signed job endpoint of the deployed app every 10 minutes (screening of submitted
# listings, the moderation safety net, the stuck-session watchdog, purges, analytics rollups).
# Vercel Hobby runs its own cron only once a day (vercel.json); this fills the gap for free.
#
# It does nothing until the repository has BOTH secrets (Settings -> Secrets and variables ->
# Actions -> New repository secret):
#   DELULU_APP_ORIGIN        https://your-domain (no trailing slash)
#   DELULU_JOBS_SIGNING_KEY  the same value as JOBS_SIGNING_KEY in Vercel (64 hex characters)
# The key never appears in the log: it is only used by openssl to sign. Every job is idempotent and
# each signature is accepted once, so a late, skipped or doubled run is harmless.
#
# The log shows only the HTTP status and ONE count (listings screened); the job report itself is
# never printed (a public repository's Actions logs are public). No pull_request trigger (a fork's
# pull request must never run with these secrets), no permissions for the token, no third-party
# actions (nothing to pin): one shell step with curl, openssl and jq from the runner image.
name: jobs-scheduler

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: jobs-scheduler
  cancel-in-progress: false

jobs:
  run-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the signed jobs endpoint
        env:
          APP_ORIGIN: ${{ secrets.DELULU_APP_ORIGIN }}
          JOBS_SIGNING_KEY: ${{ secrets.DELULU_JOBS_SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${APP_ORIGIN}" ] || [ -z "${JOBS_SIGNING_KEY}" ]; then
            echo "Not configured (add DELULU_APP_ORIGIN and DELULU_JOBS_SIGNING_KEY to enable). Skipping."
            exit 0
          fi
          case "${APP_ORIGIN}" in https://*) ;; *) echo "DELULU_APP_ORIGIN must start with https://"; exit 1 ;; esac
          body='{}'
          ts="$(date +%s)"
          sig="$(printf '%s.%s' "${ts}" "${body}" | openssl dgst -sha256 -mac HMAC -macopt "hexkey:${JOBS_SIGNING_KEY}" -r | cut -d' ' -f1)"
          report="$(mktemp)"
          trap 'rm -f "${report}"' EXIT
          status="$(curl --silent --show-error --output "${report}" --write-out '%{http_code}' \
            --max-time 90 --proto '=https' \
            -X POST "${APP_ORIGIN}/api/internal/jobs/run" \
            -H 'content-type: application/json' \
            -H "x-delulu-timestamp: ${ts}" \
            -H "x-delulu-signature: ${sig}" \
            --data "${body}" 2>/dev/null || true)"
          screened="$(jq -r '.report.screening.processed // 0' "${report}" 2>/dev/null || echo 0)"
          case "${screened}" in ''|*[!0-9]*) screened=0 ;; esac
          echo "HTTP ${status}; listings screened: ${screened}"
          if [ "${status}" != "200" ]; then exit 1; fi
